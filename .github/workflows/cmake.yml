name: Github Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'  # Once per day

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release


permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Requirements
      run: |
        sudo apt-get update
        sudo apt-get install sphinx-doc doxygen graphviz libhdf5-dev libopenblas-dev liblapack-dev liblapacke-dev gpg-agent wget --yes
        pip3 install sphinx-rtd-theme breathe sphinx-sitemap sphinx==7.1 exhale pydata-sphinx-theme myst-parser

    - name: Configure CMake and Build
      run: |
        make -C ${{ github.workspace }} -j12
        touch ${{ github.workspace }}/build/docs/sphinx/.nojekyll

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: '${{ github.workspace }}/build/docs/sphinx'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
